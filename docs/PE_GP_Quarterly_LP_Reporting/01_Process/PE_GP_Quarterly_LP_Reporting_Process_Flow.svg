<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1900" viewBox="0 0 1600 1900">
<rect width="1600" height="1900" fill="#F8FAFC"/>
<defs><marker id="arrow" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><path d="M0,0 L12,4 L0,8 z" fill="#334155"/></marker></defs>
<text x="800" y="70" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#0B1726">PE GP Quarterly LP Reporting - Controlled Workflow</text>
<text x="800" y="108" text-anchor="middle" font-family="Arial" font-size="20" fill="#475569">Correct GP-to-LP reporting process with internal review gates, source lineage, and controlled distribution</text>
<rect x="120" y="155" rx="18" ry="18" width="1360" height="108" fill="#0B1726"/>
<text x="155" y="195" font-family="Arial" font-size="24" font-weight="700" fill="#FFFFFF">1. Source Intake</text>
<text x="155" y="227" font-family="Arial" font-size="18" fill="#E2E8F0">Portfolio company PDFs, KPI workbooks, board materials, fund administrator files, valuation support, prior LP report,</text>
<text x="155" y="251" font-family="Arial" font-size="18" fill="#E2E8F0">legal checklist, and review emails.</text>
<line x1="800" y1="263" x2="800" y2="303" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="120" y="321" rx="18" ry="18" width="1360" height="108" fill="#0B1726"/>
<text x="155" y="361" font-family="Arial" font-size="24" font-weight="700" fill="#FFFFFF">2. Ingestion &amp; Classification</text>
<text x="155" y="393" font-family="Arial" font-size="18" fill="#E2E8F0">Classify PDF, XLSX, email, and prior-report inputs; identify entity, reporting period, source owner, duplicate</text>
<text x="155" y="417" font-family="Arial" font-size="18" fill="#E2E8F0">submissions, and version.</text>
<line x1="800" y1="429" x2="800" y2="469" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="120" y="487" rx="18" ry="18" width="1360" height="108" fill="#0B1726"/>
<text x="155" y="527" font-family="Arial" font-size="24" font-weight="700" fill="#FFFFFF">3. Metric Normalization</text>
<text x="155" y="559" font-family="Arial" font-size="18" fill="#E2E8F0">Map synonyms into a common metric dictionary; normalize revenue, EBITDA, leverage, liquidity, NAV, TVPI, DPI, RVPI,</text>
<text x="155" y="583" font-family="Arial" font-size="18" fill="#E2E8F0">and IRR.</text>
<line x1="800" y1="595" x2="800" y2="635" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="120" y="653" rx="18" ry="18" width="1360" height="108" fill="#0B1726"/>
<text x="155" y="693" font-family="Arial" font-size="24" font-weight="700" fill="#FFFFFF">4. Exception Queue</text>
<text x="155" y="725" font-family="Arial" font-size="18" fill="#E2E8F0">Flag missing EBITDA, missing gross margin, low confidence extraction, stale period, inconsistent source, or</text>
<text x="155" y="749" font-family="Arial" font-size="18" fill="#E2E8F0">unsupported narrative claim.</text>
<line x1="800" y1="761" x2="800" y2="801" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="120" y="819" rx="18" ry="18" width="1360" height="108" fill="#1F4E79"/>
<text x="155" y="859" font-family="Arial" font-size="24" font-weight="700" fill="#FFFFFF">5. Deal Team Review</text>
<text x="155" y="891" font-family="Arial" font-size="18" fill="#E2E8F0">Investment analysts, deal leads, and portfolio operations validate company metrics, operating drivers, risks, and Q2</text>
<text x="155" y="915" font-family="Arial" font-size="18" fill="#E2E8F0">priorities.</text>
<line x1="800" y1="927" x2="800" y2="967" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="120" y="985" rx="18" ry="18" width="1360" height="108" fill="#1F4E79"/>
<text x="155" y="1025" font-family="Arial" font-size="24" font-weight="700" fill="#FFFFFF">6. Fund Accounting / CFO Review</text>
<text x="155" y="1057" font-family="Arial" font-size="18" fill="#E2E8F0">Fund controller and CFO reconcile NAV, fees, expenses, capital accounts, contributions, distributions, TVPI, DPI,</text>
<text x="155" y="1081" font-family="Arial" font-size="18" fill="#E2E8F0">RVPI, and IRR.</text>
<line x1="800" y1="1093" x2="800" y2="1133" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="120" y="1151" rx="18" ry="18" width="1360" height="108" fill="#1F4E79"/>
<text x="155" y="1191" font-family="Arial" font-size="24" font-weight="700" fill="#FFFFFF">7. Valuation Committee Review</text>
<text x="155" y="1223" font-family="Arial" font-size="18" fill="#E2E8F0">Committee approves fair value marks, valuation methodology, market multiples, company-specific changes, and valuation</text>
<text x="155" y="1247" font-family="Arial" font-size="18" fill="#E2E8F0">disclosures.</text>
<line x1="800" y1="1259" x2="800" y2="1299" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="120" y="1317" rx="18" ry="18" width="1360" height="108" fill="#1F4E79"/>
<text x="155" y="1357" font-family="Arial" font-size="24" font-weight="700" fill="#FFFFFF">8. Investor Relations Review</text>
<text x="155" y="1389" font-family="Arial" font-size="18" fill="#E2E8F0">IR shapes LP narrative, report structure, formatting, approved language, distribution list, and investor follow-up</text>
<text x="155" y="1413" font-family="Arial" font-size="18" fill="#E2E8F0">process.</text>
<line x1="800" y1="1425" x2="800" y2="1465" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="120" y="1483" rx="18" ry="18" width="1360" height="108" fill="#1F4E79"/>
<text x="155" y="1523" font-family="Arial" font-size="24" font-weight="700" fill="#FFFFFF">9. Legal &amp; Compliance Review</text>
<text x="155" y="1555" font-family="Arial" font-size="18" fill="#E2E8F0">Legal/compliance approves confidentiality language, MNPI controls, marketing rule constraints, forward-looking</text>
<text x="155" y="1579" font-family="Arial" font-size="18" fill="#E2E8F0">statements, and retention.</text>
<line x1="800" y1="1591" x2="800" y2="1631" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="120" y="1649" rx="18" ry="18" width="1360" height="108" fill="#2E7D60"/>
<text x="155" y="1689" font-family="Arial" font-size="24" font-weight="700" fill="#FFFFFF">10. Managing Partner Approval &amp; Distribution</text>
<text x="155" y="1721" font-family="Arial" font-size="18" fill="#E2E8F0">Managing Partner signs off; platform watermarks the report, applies LP permissions, distributes, and archives the</text>
<text x="155" y="1745" font-family="Arial" font-size="18" fill="#E2E8F0">evidence trail.</text>
<rect x="120" y="1835" width="1360" height="78" rx="14" fill="#E2E8F0" stroke="#CBD5E1"/>
<text x="155" y="1866" font-family="Arial" font-size="22" font-weight="700" fill="#0B1726">Control Lane A - Source Lineage</text>
<text x="155" y="1893" font-family="Arial" font-size="17" fill="#334155">Every value has source file, page/sheet/cell, confidence score, formula, reviewer, approval status, and final report location.</text>
<rect x="120" y="1945" width="1360" height="78" rx="14" fill="#E2E8F0" stroke="#CBD5E1"/>
<text x="155" y="1976" font-family="Arial" font-size="22" font-weight="700" fill="#0B1726">Control Lane B - Human Accountability</text>
<text x="155" y="2003" font-family="Arial" font-size="17" fill="#334155">AI extraction and synthesis accelerate the work, but deal team, CFO, valuation committee, IR, legal/compliance, and Managing Partner approve external release.</text>
<rect x="120" y="2055" width="1360" height="78" rx="14" fill="#E2E8F0" stroke="#CBD5E1"/>
<text x="155" y="2086" font-family="Arial" font-size="22" font-weight="700" fill="#0B1726">Control Lane C - Evidence Archive</text>
<text x="155" y="2113" font-family="Arial" font-size="17" fill="#334155">Final PDF, source package, calculation workbook, review comments, approvals, distribution evidence, and retention metadata are archived together.</text>
</svg>